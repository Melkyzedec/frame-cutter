name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Ensure FFmpeg and ffprobe are available
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Verify dependency hashes
        run: python -m pip install --dry-run --disable-pip-version-check --ignore-installed --require-hashes -r requirements-import.txt

      - name: Run unit tests
        run: python -B -W default -m unittest discover -s tests -v
